<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>택진 ♡ 설희 결혼합니다</title>
<meta property="og:title" content="택진 ♡ 설희 결혼합니다">
<meta property="og:description" content="2027년 3월 6일 토요일 오후 3시 · 양재 엘타워">
<!-- 모바일 청첩장이 나오면 아래 주석을 풀고 주소만 바꾸면 QR이 그쪽으로 바로 넘어갑니다.
<meta http-equiv="refresh" content="0; url=https://모바일청첩장주소">
-->
<style>
  :root { --ink:#2e563f; --paper:#fbf8f1; }
  * { box-sizing:border-box; margin:0; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--paper); color:var(--ink); padding:32px 16px;
    font-family:"Nanum Myeongjo","Noto Serif KR",serif; text-align:center; }
  .card { max-width:360px; }
  .eyebrow { letter-spacing:.35em; font-size:12px; margin-bottom:28px; }
  h1 { font-weight:400; font-size:26px; margin-bottom:24px; }
  .info { font-size:16px; line-height:1.9; margin-bottom:28px; }
  .note { font-size:13px; opacity:.75; line-height:1.7; }
  hr { width:40px; border:0; border-top:1px solid var(--ink); margin:24px auto; opacity:.5; }
</style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">WEDDING INVITATION</p>
    <h1>택진 ♡ 설희</h1>
    <p class="info">2027년 3월 6일 토요일 오후 3시<br>양재 엘타워<br>서울 서초구 강남대로 213</p>
    <hr>
    <p class="note">모바일 청첩장을 준비하고 있어요.<br>조금만 기다려 주세요.</p>
  </main>
</body>
</html>
